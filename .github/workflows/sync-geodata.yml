name: Sync geodata release

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 05:55 Asia/Shanghai.
    - cron: "55 21 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download geodata assets
        run: node scripts/sync-geodata.mjs

      - name: Run geodata tests
        run: node tests/sync-geodata.test.js

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view geodata-latest >/dev/null 2>&1 || \
            gh release create geodata-latest \
              --title "Geodata latest" \
              --notes "Automated mirror of MetaCubeX geodata assets."
          gh release upload geodata-latest geodata/* --clobber
